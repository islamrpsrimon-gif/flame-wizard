<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FlyMage</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#0a0a0a url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=800') center/cover no-repeat;
  background-attachment:fixed; font-family:'Baloo 2',cursive; min-height:100vh;
}
body::before{content:'';position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:-1}
.app{max-width:420px;margin:0 auto;min-height:100vh;background:linear-gradient(180deg,rgba(20,20,30,0.6),rgba(0,0,0,0.8));padding:8px 8px 20px}

/* Stone Button Style */
.stone{
  background:linear-gradient(180deg,#d8d2c4 0%,#b8b2a2 50%,#a8a29a 100%);
  border:2px solid #5a544a; border-radius:12px;
  box-shadow:inset 0 2px 0 #fff8, inset 0 -2px 0 #0004, 0 3px 8px #0008, 0 0 0 2px #2a2a2a;
  position:relative; color:#1a1a1a; font-weight:800;
}
.stone::before{
  content:'';position:absolute;inset:0;border-radius:10px;
  background:repeating-linear-gradient(90deg,transparent 0 2px,rgba(0,0,0,0.03) 2px 4px);
  pointer-events:none;
}

/* Top */
.topRow{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.balStone{flex:1.2;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 10px;font-size:13px}
.balStone b{font-size:22px}
.rmBtn{width:58px;height:58px;border-radius:50%;background:#2ec4b6;border:3px solid #fff;display:grid;place-items:center;color:#fff;font-size:22px;font-weight:900;box-shadow:0 4px 10px #000}
.profBtn{flex:0.8;padding:10px;text-align:center;font-size:14px}

.menuRow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px}
.mBtn{padding:10px 2px;text-align:center;font-size:12px;border-radius:10px}

.dailyWrap{color:#fff;margin-bottom:12px}
.dailyTop{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.dailyBar{height:6px;background:rgba(255,255,255,0.3);border-radius:3px;overflow:hidden}
.dailyFill{height:100%;width:35%;background:linear-gradient(90deg,#fff,#ccc)}

/* Main Area */
.mainArea{display:grid;grid-template-columns:1.1fr 1.5fr;gap:10px;margin-bottom:14px}

.bigCard{
  background:linear-gradient(180deg,#e8e0d0,#c8c0b0); border:3px solid #6a645a;
  border-radius:18px; padding:10px; box-shadow:inset 0 2px 0 #fff,0 6px 15px #000,0 0 0 2px #000;
  display:flex;flex-direction:column;align-items:center; position:relative;
}
.bigCard::before{
  content:'';position:absolute;inset:0;border-radius:16px;
  background:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,0.3),transparent 60%);
}
.wizImg{font-size:85px;filter:drop-shadow(0 5px 8px #0005);margin:5px 0}
.lvlBox{background:linear-gradient(#d0c8b8,#a8a098);border:2px solid #6a645a;border-radius:12px;padding:4px 22px;font-size:22px;font-weight:900;box-shadow:0 2px 5px #0005;margin:4px 0}
.earnRow{display:flex;align-items:center;gap:4px;font-size:18px;font-weight:900;margin:6px 0}
.collectBtn{
  margin-top:8px;width:100%;padding:12px;background:linear-gradient(#d8c8d0,#b8a8b0);
  border:2px solid #8a7a80;border-radius:20px;font-weight:900;font-size:16px;letter-spacing:1px;
  box-shadow:inset 0 1px 0 #fff,0 3px 6px #0005
}

.smallGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.sBox{
  background:linear-gradient(180deg,#e8e0d0,#c8c0b0); border:2px solid #6a645a;
  border-radius:12px; aspect-ratio:1/1; display:flex;flex-direction:column;
  align-items:center;justify-content:center; box-shadow:inset 0 1px 0 #fff,0 3px 8px #000,0 0 0 1px #000;
  font-size:26px; position:relative;
}
.sBox b{font-size:15px;margin-top:2px;color:#000}

/* Magic Bar */
.magicWrap{color:#fff;margin:10px 0}
.magicTop{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.magicBar{height:6px;background:rgba(255,255,255,0.3);border-radius:3px;overflow:hidden}
.magicFill{height:100%;width:18%;background:#5a7aff}

/* Books */
.bookRow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bookCard{
  background:linear-gradient(180deg,#e8e0d0,#c8c0b0); border:2.5px solid #6a645a;
  border-radius:16px; padding:8px 6px; text-align:center;
  box-shadow:inset 0 1px 0 #fff,0 4px 10px #000,0 0 0 1px #000;
}
.bookIcon{font-size:40px;filter:drop-shadow(0 3px 4px #0004)}
.bookAdd{font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:3px;margin:4px 0}
.bookPrice{background:linear-gradient(#c8c0b0,#a8a098);border:1.5px solid #6a645a;border-radius:12px;padding:3px 8px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:3px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:99;display:none;place-items:center;padding:20px}
.modal.show{display:grid}
.mBox{background:#e8e0d0;border:3px solid #6a645a;border-radius:16px;padding:20px;width:100%;max-width:300px;text-align:center}
</style>
</head>
<body>
<div class="app">

<div class="topRow">
<div class="stone balStone"><span style="font-size:12px;font-weight:600">My balance</span> 🔥 <b id="bal">226</b></div>
<div class="rmBtn">RM</div>
<div class="stone profBtn">Profile</div>
</div>

<div class="menuRow">
<div class="stone mBtn">Magician</div>
<div class="stone mBtn" onclick="openM('dep')">Deposit</div>
<div class="stone mBtn" onclick="openM('wd')">Withdraw</div>
<div class="stone mBtn">Partners</div>
</div>

<div class="dailyWrap">
<div class="dailyTop"><span>Daily income</span><span>🔥 <b id="daily">1 962</b></span></div>
<div class="dailyBar"><div class="dailyFill"></div></div>
</div>

<div class="mainArea">
<div class="bigCard">
<div class="wizImg">🧙‍♂️</div>
<div class="lvlBox" id="lvl">37</div>
<div class="earnRow">🔥 <span id="earn">0.7500</span></div>
<div class="collectBtn" onclick="collect()">COLLECT</div>
</div>

<div class="smallGrid" id="grid"></div>
</div>

<div class="magicWrap">
<div class="magicTop"><span>Magic</span><span>1708 🔮</span></div>
<div class="magicBar"><div class="magicFill"></div></div>
</div>

<div class="bookRow">
<div class="bookCard">
<div class="bookIcon">📔</div>
<div class="bookAdd">+500 🔮</div>
<div class="bookPrice">🔥 100</div>
</div>
<div class="bookCard">
<div class="bookIcon">📘</div>
<div class="bookAdd">+5 000 🔮</div>
<div class="bookPrice">🔥 1 000</div>
</div>
<div class="bookCard">
<div class="bookIcon">📕</div>
<div class="bookAdd">+25 000 🔮</div>
<div class="bookPrice">🔥 5 000</div>
</div>
</div>

</div>

<div class="modal" id="depM"><div class="mBox"><h3>📥 Deposit</h3><p style="font-size:13px;margin:10px 0">Deposit system পরে বসানো হবে।<br>এখানে TON Address বসবে।</p><button onclick="closeM()" style="width:100%;padding:10px;border-radius:10px;border:none;background:#6a645a;color:#fff;font-weight:800">OK</button></div></div>
<div class="modal" id="wdM"><div class="mBox"><h3>📤 Withdraw</h3><p style="font-size:13px;margin:10px 0">Withdraw system পরে বসানো হবে।</p><button onclick="closeM()" style="width:100%;padding:10px;border-radius:10px;border:none;background:#6a645a;color:#fff;font-weight:800">OK</button></div></div>

<script>
let balance=226;
let earn=0.75;
let wiz=[
{emoji:'🧙‍♂️',c:4},{emoji:'🧝‍♀️',c:3},{emoji:'🧙‍♂️',c:3},
{emoji:'🧚‍♀️',c:13},{emoji:'🧙‍♀️',c:8},{emoji:'🔮',c:3},
{emoji:'🧙‍♂️',c:3},{emoji:'⬜',c:0},{emoji:'⬜',c:0},
{emoji:'⬜',c:0},{emoji:'⬜',c:0},{emoji:'⬜',c:0},
];
function render(){
document.getElementById('bal').innerText=balance;
document.getElementById('grid').innerHTML=wiz.map(w=>`<div class="sBox"><div>${w.emoji}</div><b>${w.c}</b></div>`).join('');
}
function collect(){
balance+=earn; earn+=0.01;
document.getElementById('earn').innerText=earn.toFixed(4);
document.getElementById('bal').innerText=Math.floor(balance);
Telegram.WebApp.HapticFeedback.notificationOccurred('success');
}
function openM(t){document.getElementById(t=='dep'?'depM':'wdM').classList.add('show')}
function closeM(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('show'))}
render();
Telegram.WebApp.ready();Telegram.WebApp.expand();
</script>
</body>
</html>
